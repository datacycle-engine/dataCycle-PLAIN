default: &default
  adapter: postgis
  encoding: unicode
  schema_search_path: postgis, public
  # A ceiling, not a preallocation: connections are opened on demand and idle ones are reaped, so a
  # process only holds what it uses. The web process needs the puma threads + the async query pool
  # (global_executor_concurrency), which is 2x; the third is headroom for the jobs container, where
  # a SolidQueue worker shares one pool between all of its threads and the pools their jobs open
  # (DataCycleCore::WorkerPool.default_num_workers divides this by the worker's thread count).
  #
  # What limits the multiplier is the total across processes -- one per puma worker, plus the
  # supervisor, dispatcher and, per worker entry in queue.yml, as many as its `processes` says --
  # against the postgres max_connections shared with grafana/alloy. Check the real number with
  # `SELECT count(*) FROM pg_stat_activity` before raising it, and use DB_POOL_SIZE to give a single
  # container more (the jobs one) instead of lifting every process at once.
  pool: <%= ENV["DB_POOL_SIZE"].presence&.to_i || ENV["PUMA_MAX_THREADS"]&.to_i&.*(3) || 15 %>
  host: <%= ENV["POSTGRES_HOST"] || "localhost" %>
  port: <%= ENV["POSTGRES_PORT"] || 5432 %>
  username: <%= ENV["POSTGRES_USER"] || "developer" %>
  password: <%= ENV["POSTGRES_PASSWORD"] || "password" %>
  variables:
    statement_timeout: 1min
    idle_in_transaction_session_timeout: 5min
    # pgvector >= 0.8: an HNSW scan continues past its candidate list (hnsw.ef_search, 40), so a
    # similarity query can answer up to its 1,000 nearest instead of at most 40 (#49844)
    hnsw.iterative_scan: relaxed_order

development:
  <<: *default
  database: <%= ENV["POSTGRES_DATABASE"] %>

test:
  <<: *default
  database: <%= (ENV["POSTGRES_DATABASE_TEST"] || "data-cycle-test") + ENV["TEST_ENV_NUMBER"].to_s %>

staging:
  <<: *default
  database: <%= ENV["POSTGRES_DATABASE"] %>

production:
  <<: *default
  database: <%= ENV["POSTGRES_DATABASE"] %>
