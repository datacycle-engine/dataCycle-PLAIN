<!doctype html>

<html lang="de">

<head>

  <!--
    nginx serves this when it cannot reach `web` at all - a deploy restarting it, or a crash - so
    unlike DataCycleCore::ExceptionsController#service_unavailable_exception, which knows the
    process trails the database, it must not name a cause. Both close on the same sentence; change
    them together. No Rails here to pick a locale or compose a title, so both languages are spelled
    out for the closing script to keep the one the browser prefers, the title matches what the
    layout renders for the dynamic page, and the CSS and script stay inline.
  -->
  <title>503 Service Unavailable</title>

  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      background: #FFF;
      color: #261B23;
      display: grid;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: clamp(1rem, 2.5vw, 2rem);
      -webkit-font-smoothing: antialiased;
      font-style: normal;
      font-weight: 400;
      letter-spacing: -0.0025em;
      line-height: 1.4;
      min-height: 100vh;
      place-items: center;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
    }

    a {
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 0.0925em;
    }

    b,
    strong {
      font-weight: 700;
    }

    i,
    em {
      font-style: italic;
    }

    main {
      display: grid;
      gap: 1em;
      padding: 2em;
      place-items: center;
      text-align: center;
    }

    main header {
      width: min(100%, 12em);
    }

    main header svg {
      height: auto;
      max-width: 100%;
      width: 100%;
    }

    main article {
      width: min(100%, 30em);
    }

    main article p {
      font-size: 75%;
    }

    main article p+p {
      margin-top: 0.75em;
      opacity: 0.75;
    }

    main article br {

      display: none;

      @media(min-width: 48em) {
        display: inline;
      }

    }
  </style>

</head>

<body>

  <!-- This file lives in public/503.html -->

  <main>
    <header>
      <svg height="172" viewBox="0 0 480 172" width="480" xmlns="http://www.w3.org/2000/svg"><text x="240" y="171"
          fill="#f0eff0" text-anchor="middle" textLength="455" lengthAdjust="spacingAndGlyphs"
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="228" font-weight="900">503</text><text x="240" y="103" fill="#d30001" text-anchor="middle"
          textLength="413" lengthAdjust="spacingAndGlyphs"
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="43" font-weight="900">Service Unavailable</text></svg>
    </header>
    <article>
      <p lang="de"><strong>Die Seite ist vorübergehend nicht erreichbar.</strong><br> Bitte versuchen Sie es in
        einigen Minuten erneut.</p>
      <p lang="en"><strong>The site is temporarily unavailable.</strong><br> Please try again in a few minutes.</p>
    </article>
  </main>

  <script>
    (function () {
      var paragraphs = Array.prototype.slice.call(document.querySelectorAll('main article p[lang]'));
      var locales = paragraphs.map(function (paragraph) { return paragraph.lang; });
      var preferred = (navigator.languages || [navigator.language || '']).map(function (tag) {
        return tag.split('-')[0].toLowerCase();
      });
      var locale = preferred.filter(function (tag) { return locales.indexOf(tag) !== -1; })[0];
      if (!locale) return;

      paragraphs.forEach(function (paragraph) {
        if (paragraph.lang !== locale) paragraph.parentNode.removeChild(paragraph);
      });
      document.documentElement.lang = locale;
    })();
  </script>

</body>

</html>
