services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile-postgres
    environment:
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-datacycle-plain_development}
      - POSTGRES_USER=${POSTGRES_USER:-developer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_VERSION=${POSTGRES_VERSION:-16}
    shm_size: 4gb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-developer} -d ${POSTGRES_DATABASE:-datacycle-plain_development}" ]
      start_interval: 1s
      start_period: 10s
      interval: 30s
  mongodb:
    image: mongo:8.2
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile-web
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-datacycle-plain_development}
      - POSTGRES_USER=${POSTGRES_USER:-developer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - PGPASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_SERVER=${REDIS_SERVER:-redis}
      - MONGODB_HOST=${MONGODB_HOST:-mongodb}
      - APP_HOST=${APP_HOST:-localhost:3000}
    command: bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - '..:/var/app'
    stdin_open: true
    tty: true
  jobs:
    build:
      context: ..
      dockerfile: docker/Dockerfile-web
    environment:
      - RAILS_ENV=${RAILS_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-datacycle-plain_development}
      - POSTGRES_USER=${POSTGRES_USER:-developer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - PGPASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_SERVER=${REDIS_SERVER:-redis}
      - MONGODB_HOST=${MONGODB_HOST:-mongodb}
      - APP_HOST=${APP_HOST:-localhost:3000}
    command: bin/rake jobs:work
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - '..:/var/app'
  redis:
    image: redis:8.4-alpine
    command: >
      --maxmemory 4gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000 --loglevel warning
    restart: unless-stopped
